<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111113" />
<meta name="description" content="GachaChess — шахматы, коллекции и приключения. Играйте без интернета." />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>GachaChess</title>
<script>try{const t=localStorage.getItem('gachachess-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
</head>
<body><div id="app"></div><script type="module" src="/src/app/bootstrap/main.tsx"></script></body>
</html>
