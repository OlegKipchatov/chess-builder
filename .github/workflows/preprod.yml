name: Validate TanStack preprod
on:
  push:
    branches: [preprod]
  pull_request:
    branches: [preprod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preprod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:store
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: preprod-static
          path: .output/public/
          include-hidden-files: true
