name: Test and publish Chess Vault

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Fetch and verify pinned Stockfish release
        run: npm run prepare:engine
      - name: Test chess rules and rewards
        id: regression
        run: npm test
      - name: Install Chromium for offline regression tests
        run: npx playwright install --with-deps chromium
      - name: Test cold offline launch and PWA upgrade
        run: npm run test:pwa:browser
      - name: Test both Stockfish runtimes and initialization fallback
        if: always() && steps.regression.outcome == 'success'
        run: npm run test:stockfish:browser
      - name: Test offline single-threaded PWA
        if: always() && steps.regression.outcome == 'success'
        run: npm run test:pwa:single
      - name: Typecheck strict application contracts
        run: npm run typecheck
      - name: Lint React and TypeScript
        run: npm run lint
      - name: Check generated motion tokens
        run: npm run motion:check
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            /tmp/gachachess-*.png
            /tmp/gacha-*.png
            /tmp/autochess*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain tested static build
        uses: actions/upload-artifact@v4
        with:
          name: gachachess-react-${{ github.sha }}
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify pinned Stockfish release
        run: npm run prepare:engine
      - name: Install build dependencies
        run: npm ci
      - name: Build static release
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
