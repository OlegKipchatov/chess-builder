<!doctype html><meta charset="utf-8"><title>GachaChess — проверка Worker</title>
<button id="run">Проверить Worker</button><pre id="result">Готово к запуску</pre>
<script type="module">
import {createStockfish19Client} from '../dist/stockfish-client.js';
import {Chess} from '../dist/chess.js';
const output=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 const client=createStockfish19Client(),profile={id:'humanized19-v1',targetElo:446,effectiveElo:460.4859445538423,seed:219237029},rows=[];
 const ask=game=>new Promise((resolve,reject)=>{const start=performance.now();client.onmessage=({data})=>resolve({...data,ms:performance.now()-start});client.onerror=reject;client.postMessage({id:rows.length+1,fen:game.fen(),pgn:game.pgn(),engineProfile:profile});});
 try{
  const game=new Chess(),moves=['g4','e5','g5','f6','b3','fxg5'];
  for(let i=0;i<=moves.length;i++){
   output.textContent=`Расчёт позиции ${i+1}`;
   const reply=await ask(game),copy=new Chess(game.fen());if(!copy.move(reply.move))throw Error('Illegal move');rows.push({kind:'reported-pgn',ply:i,ms:reply.ms,move:reply.move});
   if(i<moves.length)game.move(moves[i]);
  }
  for(let i=0;i<20&&!game.isGameOver();i++){output.textContent=`Продолжение ${i+1}`;const reply=await ask(game);game.move(reply.move);rows.push({kind:'continuation',ms:reply.ms,move:reply.move});}
  output.textContent=JSON.stringify({ok:true,isolated:self.crossOriginIsolated,rows,finalPgn:game.pgn()},null,2);
 }catch(error){output.textContent=JSON.stringify({ok:false,error:error.message,rows},null,2);}finally{client.terminate();}
};
</script>
